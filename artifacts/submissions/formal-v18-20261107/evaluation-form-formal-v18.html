<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖序 QIXU · 评分表 formal-v18</title>
<style>
:root { --gold:#b9935a; --ink:#2c2a26; --paper:#faf7f2; --line:#e6ddcd; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif; background:var(--paper); color:var(--ink); }
header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; z-index:5; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
h1 { font-size:17px; margin:0; letter-spacing:1px; }
.muted { color:#8a8374; font-size:12px; }
#progress { font-weight:600; color:var(--gold); }
button { cursor:pointer; border:1px solid var(--gold); background:#fff; color:var(--ink); padding:6px 14px; border-radius:6px; font-size:13px; }
button.primary { background:var(--gold); color:#fff; }
button:hover { opacity:.9; }
main { max-width:860px; margin:0 auto; padding:14px 20px 80px; }
.case { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.case.done { border-left:4px solid var(--gold); }
.case h2 { font-size:14px; margin:0 0 6px; }
.cand { border-top:1px dashed var(--line); padding:10px 0; }
.cand .text { white-space:pre-wrap; background:#fbf9f4; padding:8px 10px; border-radius:6px; font-size:13.5px; }
.radios { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 4px; font-size:13px; }
.radios label { display:flex; gap:4px; align-items:center; }
.sev { margin-left:auto; display:flex; gap:4px; align-items:center; font-size:13px; color:#a33; }
.reason { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
.group { border-top:2px solid var(--gold); padding-top:8px; font-size:13px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.group input { width:60%; }
.hint { color:#a33; font-size:12px; display:none; }
fieldset { border:1px solid var(--line); border-radius:8px; margin:10px 0; padding:10px; background:#fdfaf4; font-size:13px; }
legend { color:var(--gold); font-weight:600; padding:0 6px; }
</style>
</head>
<body>
<header>
  <h1>栖序 QIXU · 候选评分表</h1>
  <span class="muted">formal-v18 · 50 例 × 3 条 = 150 条 · 进度 <span id="progress">0/50</span></span>
  <label class="muted">评分人 <input id="rater" style="width:120px" placeholder="你的名字"></label>
  <button id="exportBtn" class="primary">导出结果</button>
  <button id="copyBtn">复制结果</button>
  <button id="importBtn">导入进度</button>
  <input type="file" id="importFile" accept=".jsonl,.json" hidden>
  <button id="resetBtn">清空</button>
  <div id="exportModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;padding:24px;">
    <div style="background:#fff;border-radius:10px;max-width:760px;margin:0 auto;padding:16px;height:85vh;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>导出结果（ratings.jsonl 内容）</b>
        <button id="closeModal">关闭</button>
      </div>
      <p class="muted" id="exportSummary"></p>
      <textarea id="exportText" readonly style="flex:1;font:12px/1.5 monospace;border:1px solid #ddd;border-radius:6px;padding:8px;"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button id="copyFromModal" class="primary">复制全部</button>
        <button id="downloadFromModal">下载文件</button>
      </div>
    </div>
  </div>
</header>
<main id="main">
<fieldset>
  <legend>两步评价</legend>
  <b>第一步·硬失败筛查</b>：有「没回答/答非所问/编造事实或越权/拒绝联系仍召回/模型自述或结构不可发送」任一问题 → 勾「严重错误」，档位必须选「弃用」。<br>
  <b>第二步·档位</b>：直接用（可直接发送）｜小改可用（删冗余/换称呼/调语序）｜实质改写（要改人物/商品/金额/方向）｜弃用（主干保不住）。<br>
  每条都要写一句理由；每组底部判断「至少两条独立可用」。进度自动保存在本机浏览器，随时可关页面接着评。
</fieldset>
</main>
<script>
const ITEMS = [{"case_id": "BD-001", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-001-C1", "text": "蒋先生，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当，所有的美好都如约而至。愿这一年像清晨的柑橘一样清爽明亮，日子过得舒展自在。"}, {"candidate_id": "BD-001-C2", "text": "蒋先生，今天是您的生日，祝您生日快乐。愿这一年身体康健、事事如愿，身边的人都平平安安。若今天有空，也别忘了给自己留一点清闲。"}, {"candidate_id": "BD-001-C3", "text": "蒋先生，生日快乐。四季轮转，又到属于您的日子，愿这一年平安顺遂，所愿皆成真。愿您往后的每一天都从容自在，心里常有清爽明亮的时候。"}]}, {"case_id": "BD-002", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-002-C1", "text": "叶女士，过年好。新的一年愿您平安顺遂，想做的事都顺顺当当。日子像玫瑰慢慢开，不急着赶，每天都从容自在。"}, {"candidate_id": "BD-002-C2", "text": "叶女士，新春快乐。愿这一年少些奔波、多些清闲，身边的人都平平安安。轻松一点过，事事顺心。"}, {"candidate_id": "BD-002-C3", "text": "叶女士，过年好。愿您新的一岁身体康健，日子舒展，想要的都慢慢实现。春天快到了，愿您的心情也一天天亮起来。"}]}, {"case_id": "BD-003", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-003-C1", "text": "国庆那档 10 月 1 日到 8 日，已经结束了，之后的安排要等门店通知。现在能说的是品牌十周年月，12 月 1 日到 31 日全月，购任意 50 mL 正装赠定制小样 2 支，具体赠品和数量以门店为准。您要是想赶这一档，我可以先帮您登记意向，由门店和您确认。"}, {"candidate_id": "BD-003-C2", "text": "国庆那档已经结束了，后面最近的是品牌十周年月，12 月整月，购任意 50 mL 正装赠定制小样 2 支，赠品和数量以门店为准。您平时用青岚，这次可以留意这一档。要不要我帮您把意向登记给门店？"}, {"candidate_id": "BD-003-C3", "text": "国庆那档 10 月 8 日就结束了，后面能提的是品牌十周年月，12 月 1 日到 31 日全月，购任意 50 mL 正装赠定制小样 2 支。赠品和数量以门店为准，我这边不替门店定。您看是现在登记意向，还是等 12 月临近再说？"}]}, {"case_id": "REC-001", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-001-C1", "text": "林女士，妹妹喜欢柑橘、不喜甜香，青岚这款香水更贴近她的方向：柑橘与雪松的气息，清爽、甜度低，50 mL 是 980 元，在您的预算内。暮光偏柔和玫瑰，和她的偏好不太一致，这次可以先不列入。要不要约她或您到店闻一下青岚？试香意向我来登记，具体时间由门店和您确认。"}, {"candidate_id": "REC-001-C2", "text": "给妹妹选，先按她的柑橘方向来。青岚 50 mL 是 980 元，柑橘与雪松气息，甜度低，比较合适；雨白是茶叶与鸢尾气息，也偏清爽，50 mL 是 1180 元，同样在预算内。暮光以玫瑰为主，更适合您自己的偏好，这次不急着考虑。您看是先从青岚定，还是想让我把这两支都留作试闻？"}, {"candidate_id": "REC-001-C3", "text": "林女士，预算一千六以内，青岚 50 mL 980 元最贴合妹妹的柑橘偏好，气味是柑橘与雪松，甜度低。若想多一个选择，雨白 50 mL 1180 元，茶叶与鸢尾气息，也偏清爽方向。她没闻过的话，我建议先试香再定，我可以帮您登记到店试闻意向，时间由门店和您确认。"}]}, {"case_id": "REC-002", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-002-C1", "text": "方先生，青岚 50 mL 是 980 元，100 mL 是 1580 元。它是柑橘与雪松的气息，甜度低，和您平时喜欢的木质方向接近。两个容量一次收，更多是备着慢慢用，值不值要看您自己的用量习惯。您想先各留一瓶，还是先定一个容量？"}, {"candidate_id": "REC-002-C2", "text": "方先生，青岚这款香水是柑橘与雪松的气息，低甜度，您应该会闻得顺。50 mL 980 元，100 mL 1580 元，两个容量同香。您在意前中后调的结构，青岚的柑橘开场到雪松收尾，层次是清楚的。要不要我先帮您登记到店试闻，闻过再决定收哪个容量？"}, {"candidate_id": "REC-002-C3", "text": "方先生，青岚 50 mL 980 元，100 mL 1580 元。您收藏向，两个容量一起收也合理，只是青岚偏清爽，和您常收的焚香木质是两条线。如果拿不准，可以先到店再闻一次青岚，确认它和您想收的方向一致。您方便哪天过来？"}]}, {"case_id": "REC-003", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-003-C1", "text": "苏女士，按男士、喜欢木质、不要太甜这几点，砚泊更贴近。砚泊是干燥木质与焚香气息，甜度低，灵感来自旧书房的书架和一炉将熄的焚香。它是 30 mL 限量装，780 元，在您的预算内。要不要先到店闻一下？我帮您登记试香意向，时间由门店和您确认。"}, {"candidate_id": "REC-003-C2", "text": "苏女士，收礼人喜欢木质、排斥甜香，这个方向比较清楚。砚泊是干燥木质与焚香气息，甜度低；青岚是柑橘与雪松气息，也偏清爽，但木质感比砚泊轻一些，50 mL 是 980 元。两支都可以到店试闻，您想先看哪一支？"}, {"candidate_id": "REC-003-C3", "text": "苏女士，木质、不甜这两点，砚泊最合适。砚泊 30 mL 是 780 元，干燥木质与焚香气息，适合沉稳的场合。暮光偏玫瑰与柔和木质，甜度中等，和收礼人的偏好不太一致。您方便的话，我帮您约到店试闻，闻过再定也不迟。"}]}, {"case_id": "REC-004", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-004-C1", "text": "唐先生，收到您消息了。目前这几款里最接近您预算的是砚泊 30 mL，780 元，是干燥木质与焚香的气息，偏沉稳。青岚 50 mL 是 980 元，柑橘与雪松，清爽一些。您平时会喜欢木质多一点，还是柑橘这类清爽的？我按您的方向再帮您缩小范围。"}, {"candidate_id": "REC-004-C2", "text": "唐先生，六百五十以内目前没有对应的规格，我如实跟您说。四款都可以到店试闻，您第一次选香，闻过再定会踏实些。方便的话告诉我您平时偏清爽还是偏沉稳，我先帮您挑一两支重点闻。"}, {"candidate_id": "REC-004-C3", "text": "唐先生，砚泊 30 mL 是 780 元，在这几款里离您的预算最近，木质与焚香，适合随身。青岚 50 mL 是 980 元，柑橘与雪松，日常通勤用比较轻快。您要是愿意，我帮您登记到店试香的意向，时间由门店和您确认，闻过再决定也不迟。"}]}, {"case_id": "AFTER-001", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-001-C1", "text": "贺女士，收到您消息了。暮光 100 mL 的前调玫瑰您闻着正，说明这支和您合得来。之后用下来有任何问题，随时找我就行，我帮您对接门店。"}, {"candidate_id": "AFTER-001-C2", "text": "贺女士，谢谢您特意来说一声。暮光 100 mL 是玫瑰与柔和木质的气息，您喜欢它的前调，我听着也踏实。后面想聊香气或写香评，都可以找我。"}, {"candidate_id": "AFTER-001-C3", "text": "贺女士，收到您消息了，暮光 100 mL 您闻着喜欢就好。要是之后想再闻闻其他香，店里可以登记试香意向，由门店和您约时间。您看方便的话我来帮您问。"}]}, {"case_id": "AFTER-002", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-002-C1", "text": "林女士，暮光 50 mL 您上周带回去了，这一周用下来感觉怎么样？玫瑰和柔和木质的味道合不合您心意，您按自己的节奏说就好。用着如果有什么想了解的，或者喷头、瓶身有情况，随时发消息给我，我请门店同事帮您看。"}, {"candidate_id": "AFTER-002-C2", "text": "林女士，打扰一下，暮光 50 mL 买回去一周了，想问问您闻着还顺心吗？您之前试香时喜欢那层柔和玫瑰，现在自己用起来的感受，我这边也想听听。有任何需要，直接跟我说，我帮您对接店里。"}, {"candidate_id": "AFTER-002-C3", "text": "林女士，暮光 50 mL 到您手上有一周了，用下来还喜欢吗？如果气味或使用上有想聊的，回我一句就行；瓶身、喷头这类情况也可以拍张照片发来，我请门店同事和您确认。您方便的时候再说。"}]}, {"case_id": "AFTER-003", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-003-C1", "text": "苏女士，缎带磨损的情况我看到了。礼盒更换和刻字这两件事，我请门店同事跟您确认具体能做哪些、怎么处理。您方便拍一张缎带磨损处的照片发我吗？连同订单凭证一起，门店那边核查起来会更快。"}, {"candidate_id": "AFTER-003-C2", "text": "收到，礼盒还没送出去，缎带先磨损了确实耽误事。刻字和换礼盒都需要门店确认，我这边帮您把情况转过去。您把购买日期和订单凭证发我，我一起交给门店核查，有结果就回您。"}, {"candidate_id": "AFTER-003-C3", "text": "苏女士，暮光 100 mL 这款可以问问刻字，具体字数、样式和费用由门店跟您确认。礼盒缎带的问题，也请门店一并看下怎么处理。您先发我一张磨损处的照片和订单凭证，我转给门店，后续由他们和您对接。"}]}, {"case_id": "WAKE-001", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-001-C1", "text": "方先生，好久没联系了。上次您来试砚泊，说喜欢它的焚香尾调，我偶尔会想起这个细节。想问一句，木质和限量这个方向您还有兴趣吗？有的话我帮您留意着，等有合适的再跟您说。"}, {"candidate_id": "WAKE-001-C2", "text": "方先生，砚泊那支干燥木质与焚香的气息，您当时是当作收藏来看的。隔了这些日子，想问问这个方向您还留着兴趣没有。您方便时回一句就好，我按您的节奏来。"}, {"candidate_id": "WAKE-001-C3", "text": "方先生，打扰一下。上次私人预览您对木质与限量主题感兴趣，这半年我没敢多扰。想确认下这个方向还在您的留意范围内吗？若在，我请门店同事把相关的消息留给您；若暂时不需要，也跟我说一声就好。"}]}, {"case_id": "WAKE-002", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-002-C1", "text": "沈女士，上次您来试青岚，说喜欢木质的方向，但还不急着定。这几个月过去，不知道您是否还想再看看木质调的新东西。砚泊是干燥木质与焚香的气息，30 mL，适合随身带；暮光偏柔和，玫瑰里带木质。您方便时告诉我，我帮您登记试香，时间由门店和您确认。"}, {"candidate_id": "WAKE-002-C2", "text": "沈女士，隔了一阵子，想起您上次试青岚时说喜欢木质中调。最近店里有木质方向可以试，砚泊是干燥木质与焚香，暮光则是玫瑰与柔和木质。您要是还有兴趣，我可以帮您约个到店试闻，不着急，按您的节奏来。"}, {"candidate_id": "WAKE-002-C3", "text": "沈女士，上次您试过青岚，说喜欢木质，只是当时不急着买。最近想问问，木质方向您还想不想再看看？砚泊和暮光都可以试闻，我帮您登记意向，具体时间让门店跟您对。您看这样行吗？"}]}, {"case_id": "WAKE-003", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-003-C1", "text": "唐先生，您好，我是栖序的顾问。您之前说想先了解一下品牌，现在方便的话，我可以简单给您讲讲。四款香水都可以到店试闻，您想先看看哪方面的内容，或者等有空再聊也行。"}, {"candidate_id": "WAKE-003-C2", "text": "唐先生，您好，我是栖序的顾问。上次您提到想先了解品牌，我就先来打个招呼，不着急。栖序做的是个人香水，目前有四款可以到店试闻。您要是想慢慢看，我按您的节 const KEY = 'qixu-eval-formal-v18';
let state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); updateProgress(); }

function updateProgress() {
  let done = 0;
  for (const it of ITEMS) {
    const s = state[it.case_id];
    if (s && s.candidates && it.candidates.every(c => s.candidates[c.candidate_id] && s.candidates[c.candidate_id].decision && s.candidates[c.candidate_id].reason)) done++;
  }
  document.getElementById('progress').textContent = done + '/' + ITEMS.length;
}

function render() {
  const main = document.getElementById('main');
  const rater = document.getElementById('rater');
  if (state._rater) rater.value = state._rater;
  rater.addEventListener('input', () => { state._rater = rater.value.trim(); save(); });
  for (const it of ITEMS) {
    const s = state[it.case_id] || (state[it.case_id] = { candidates: {} });
    const div = document.createElement('div');
    div.className = 'case';
    div.id = 'case-' + it.case_id;
    div.innerHTML = '<h2>' + it.case_id + ' · ' + it.scenario + '</h2>';
    it.candidates.forEach((c, idx) => {
      const cr = s.candidates[c.candidate_id] || (s.candidates[c.candidate_id] = {});
      const cand = document.createElement('div');
      cand.className = 'cand';
      cand.innerHTML = '<div class="text">' + escapeHtml(c.text) + '</div>'
        + '<div class="radios">'
        + ['直接用','小改可用','实质改写','弃用'].map(g =>
            '<label><input type="radio" name="' + it.case_id + '-c' + idx + '" value="' + g + '">' + g + '</label>').join('')
        + '<span class="sev"><label><input type="checkbox" class="sevbox"> 严重错误</label></span>'
        + '</div>'
        + '<textarea class="reason" rows="1" placeholder="一句话理由"></textarea>';
      div.appendChild(cand);
      const radios = cand.querySelectorAll('input[type=radio]');
      const sev = cand.querySelector('.sevbox');
      const reason = cand.querySelector('.reason');
      if (cr.decision) cand.querySelector('input[value="' + cr.decision + '"]').checked = true;
      if (cr.serious_error) sev.checked = true;
      if (cr.reason) reason.value = cr.reason;
      function sync() {
        cr.decision = Array.from(radios).find(r => r.checked)?.value || '';
        cr.serious_error = sev.checked;
        cr.reason = reason.value.trim();
        if (cr.serious_error && (cr.decision === '直接用' || cr.decision === '小改可用')) {
          const discard = cand.querySelector('input[value="弃用"]');
          if (discard) discard.checked = true;
          cr.decision = '弃用';
        }
        save();
      }
      radios.forEach(r => r.addEventListener('change', sync));
      sev.addEventListener('change', sync);
      reason.addEventListener('input', () => { cr.reason = reason.value.trim(); save(); });
      reason.addEventListener('blur', sync);
    });
    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = '<label><input type="checkbox" class="two"> 至少两条独立可用</label>'
      + '<input type="text" class="dreason" placeholder="三稿差异/选稿理由（一句话）">';
    const two = group.querySelector('.two');
    const dreason = group.querySelector('.dreason');
    if (s.two_distinct_usable) two.checked = true;
    if (s.diversity_reason) dreason.value = s.diversity_reason;
    function syncGroup() {
      s.two_distinct_usable = two.checked;
      s.diversity_reason = dreason.value.trim();
      div.classList.toggle('done', two.checked);
      save();
    }
    two.addEventListener('change', syncGroup);
    dreason.addEventListener('input', () => { s.diversity_reason = dreason.value.trim(); save(); });
    dreason.addEventListener('blur', syncGroup);
    div.appendChild(group);
    main.appendChild(div);
  }
  updateProgress();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

      diversity_reason: (s.diversity_reason || '').trim(),
    };
    if (incomplete || !row.rater || !row.diversity_reason) problems.push(it.case_id);
    rows.push(row);
  }
  return { rows, problems };
}

function renderExport() {
  const { rows, problems } = buildExport();
  const text = rows.map(r => JSON.stringify(r)).join('\n');
  document.getElementById('exportText').value = text;
  document.getElementById('exportSummary').textContent =
    '共 ' + rows.length + ' 例' + (problems.length ? '；其中未完成 ' + problems.length + ' 例（仍会导出，未评候选档位为空）' : '；全部完成');
  document.getElementById('exportModal').style.display = 'block';
}

function copyText(text) {
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
}

document.getElementById('exportBtn').addEventListener('click', renderExport);
document.getElementById('copyBtn').addEventListener('click', () => {
  const { rows } = buildExport();
  copyText(rows.map(r => JSON.stringify(r)).join('\n'));
  alert('已复制到剪贴板，直接粘贴给我即可。');
});
document.getElementById('closeModal').addEventListener('click', () => document.getElementById('exportModal').style.display = 'none');
document.getElementById('copyFromModal').addEventListener('click', () => {
  copyText(document.getElementById('exportText').value);
  alert('已复制，粘贴给我即可。');
});
document.getElementById('downloadFromModal').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('exportText').value], { type: 'application/jsonl' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ratings.jsonl';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = reader.result.split('\n').filter(l => l.trim()).map(l => JSON.parse(l));
      for (const r of rows) {
        const s = state[r.case_id] || (state[r.case_id] = {});
        s.two_distinct_usable = !!r.two_distinct_usable;
        s.diversity_reason = r.diversity_reason || '';
        s.candidates = {};
        for (const c of r.candidates) s.candidates[c.candidate_id] = { decision: c.decision, serious_error: !!c.serious_error, reason: c.reason || '' };
        if (r.rater) state._rater = r.rater;
      }
      save();
      location.reload();
    } catch (err) { alert('导入失败：文件格式不对。' + err.message); }
  };
  reader.readAsText(file);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('清空全部评分进度？')) { localStorage.removeItem(KEY); location.reload(); }
});

render();
</script>
</body>
</html>
