<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖序 QIXU · 评分表 formal-v15</title>
<style>
:root { --gold:#b9935a; --ink:#2c2a26; --paper:#faf7f2; --line:#e6ddcd; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif; background:var(--paper); color:var(--ink); }
header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; z-index:5; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
h1 { font-size:17px; margin:0; letter-spacing:1px; }
.muted { color:#8a8374; font-size:12px; }
#progress { font-weight:600; color:var(--gold); }
button { cursor:pointer; border:1px solid var(--gold); background:#fff; color:var(--ink); padding:6px 14px; border-radius:6px; font-size:13px; }
button.primary { background:var(--gold); color:#fff; }
button:hover { opacity:.9; }
main { max-width:860px; margin:0 auto; padding:14px 20px 80px; }
.case { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.case.done { border-left:4px solid var(--gold); }
.case h2 { font-size:14px; margin:0 0 6px; }
.cand { border-top:1px dashed var(--line); padding:10px 0; }
.cand .text { white-space:pre-wrap; background:#fbf9f4; padding:8px 10px; border-radius:6px; font-size:13.5px; }
.radios { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 4px; font-size:13px; }
.radios label { display:flex; gap:4px; align-items:center; }
.sev { margin-left:auto; display:flex; gap:4px; align-items:center; font-size:13px; color:#a33; }
.reason { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
.group { border-top:2px solid var(--gold); padding-top:8px; font-size:13px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.group input { width:60%; }
.hint { color:#a33; font-size:12px; display:none; }
fieldset { border:1px solid var(--line); border-radius:8px; margin:10px 0; padding:10px; background:#fdfaf4; font-size:13px; }
legend { color:var(--gold); font-weight:600; padding:0 6px; }
</style>
</head>
<body>
<header>
  <h1>栖序 QIXU · 候选评分表</h1>
  <span class="muted">formal-v15 · 50 例 × 3 条 = 150 条 · 进度 <span id="progress">0/50</span></span>
  <label class="muted">评分人 <input id="rater" style="width:120px" placeholder="你的名字"></label>
  <button id="exportBtn" class="primary">导出结果（ratings.jsonl）</button>
  <button id="importBtn">导入进度</button>
  <input type="file" id="importFile" accept=".jsonl,.json" hidden>
  <button id="resetBtn">清空</button>
</header>
<main id="main">
<fieldset>
  <legend>两步评价</legend>
  <b>第一步·硬失败筛查</b>：有「没回答/答非所问/编造事实或越权/拒绝联系仍召回/模型自述或结构不可发送」任一问题 → 勾「严重错误」，档位必须选「弃用」。<br>
  <b>第二步·档位</b>：直接用（可直接发送）｜小改可用（删冗余/换称呼/调语序）｜实质改写（要改人物/商品/金额/方向）｜弃用（主干保不住）。<br>
  每条都要写一句理由；每组底部判断「至少两条独立可用」。进度自动保存在本机浏览器，随时可关页面接着评。
</fieldset>
</main>
<script>
const ITEMS = [{"case_id": "BD-001", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-001-C1", "text": "蒋先生，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当，所有的美好都如约而至。今天要过得开心，这份祝福栖序先替您记着。"}, {"candidate_id": "BD-001-C2", "text": "蒋先生，今天是您的生日，祝您生日快乐。愿这一年日子舒展，想要的都慢慢实现。若今天有空，也别忘了给自己留一点清闲。栖序陪您一起开心。"}, {"candidate_id": "BD-001-C3", "text": "蒋先生，生日快乐。愿这一年平安顺遂，事事如愿，天天都有好心情。谢谢您一直以来的信任，栖序祝您一切都好。"}]}, {"case_id": "BD-002", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-002-C1", "text": "叶女士，提前祝您生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当。这份祝福栖序先替您记着，下周二再正式送到。"}, {"candidate_id": "BD-002-C2", "text": "叶女士，下周二是您的生日，先在这里祝您生日快乐。愿这一年事事如愿，日子过得从容舒展。栖序会陪您一起，把这一天过得开心。"}, {"candidate_id": "BD-002-C3", "text": "叶女士，生日快乐。愿新的一岁少些奔波、多些清闲，身边的人都平平安安。这个日子，栖序陪您一起开心。"}]}, {"case_id": "BD-003", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-003-C1", "text": "周先生，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当，身边的人都好好的。今天这个日子，栖序陪您一起开心。"}, {"candidate_id": "BD-003-C2", "text": "周先生，生日快乐。愿这一年少些奔波、多些清闲，日子过得舒展，事事都顺心。栖序祝您一切都好。"}, {"candidate_id": "BD-003-C3", "text": "周先生，生日快乐。愿您所愿皆成真，平安顺遂常伴左右，每一天都从容自在。这份祝福栖序先替您记着。"}]}, {"case_id": "REC-001", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-001-C1", "text": "林女士，按您说的妹妹喜欢柑橘、排斥甜香，可以先看青岚。它是柑橘与雪松的气息，甜度低，青岚 50 mL 是 980 元，在您一千六以内。砚泊 30 mL 是 780 元，干燥木质与焚香，甜度也低，不过不是柑橘方向。您方便的话，可以带妹妹到店闻一下青岚，她自己的感受最准。"}, {"candidate_id": "REC-001-C2", "text": "林女士，给妹妹挑的话，青岚更贴她说的柑橘偏好，甜度低，50 mL 是 980 元。您自己偏爱的暮光甜度中等，这次先按妹妹的方向来。雨白是茶叶与鸢尾，甜度资料里没标，要请门店同事跟您说明。要不要先约个到店试闻，让她自己闻过再定？"}, {"candidate_id": "REC-001-C3", "text": "林女士，妹妹这个偏好，青岚是柑橘与雪松，甜度低，50 mL 980 元，是最直接的一支。砚泊 30 mL 780 元，木质与焚香，甜度低，可以作备选。四款都能到店试闻，我帮您登记一个试香意向，具体时间由门店和您确认。您看本周还是下周方便？"}]}, {"case_id": "REC-002", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-002-C1", "text": "方先生，青岚这次可比较的是50 mL 980元和100 mL 1580元，两款都是柑橘与雪松气息，甜度低。您平时偏好木质与皮革，也说过不喜欢甜香，青岚在方向上对得上。至于两个容量一起收值不值，主要看您是想日常用还是留作收藏，这个我不好替您定。"}, {"candidate_id": "REC-002-C2", "text": "青岚50 mL是980元，100 mL是1580元，都是柑橘与雪松气息，甜度低。您5月闻过砚泊，喜欢它的焚香尾调，青岚和它不是一个路子，您若在意前中后调结构，可以先到店再闻一次青岚。两个容量是否都收，等您闻过再定也不迟。"}, {"candidate_id": "REC-002-C3", "text": "方先生，青岚50 mL 980元、100 mL 1580元，都是柑橘与雪松气息，甜度低。您要是想先确认它合不合收藏的口味，我帮您登记到店试香意向，由门店和您约时间。闻过之后再决定两个容量怎么收，会更稳妥。"}]}, {"case_id": "REC-003", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-003-C1", "text": "苏女士，按您说的男士、偏木质、不要甜，我这边先排除暮光——它是玫瑰与柔和木质，甜度中等，可能不太合。剩下砚泊和青岚可以看：砚泊是干燥木质与焚香气息，甜度低，30 mL 780 元；青岚是柑橘与雪松，50 mL 980 元，木质感更清爽。送礼预算五千以内，这两支都在范围内。您更想送偏沉一些的木质，还是清爽一点的？"}, {"candidate_id": "REC-003-C2", "text": "苏女士，收礼人喜欢木质、排斥甜香，这两点很明确。砚泊的干燥木质与焚香更贴近前者，青岚是柑橘与雪松，也算木质方向但更清爽。暮光带玫瑰、甜度中等，我先不放进这次候选。您方便的话，可以来店里各闻一下再定；我帮您登记到店试香意向，具体时间由门店和您确认。您看哪天方便？"}, {"candidate_id": "REC-003-C3", "text": "苏女士，这次能比较的是砚泊 30 mL（780 元）和青岚 50 mL（980 元），都在您五千以内的预算里。暮光偏玫瑰、甜度中等，和“不要太甜”不太一致，先放一边。如果担心对方不喜欢，我建议先到店试闻这两支，再决定送哪支。需要的话我请门店同事跟您约个时间，您方便的话告诉我大概哪天。"}]}, {"case_id": "REC-004", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-004-C1", "text": "唐先生，六百五十以内目前没有合适的，目录里最低的是砚泊 30 mL，780 元。这款是干燥木质与焚香气息，甜度低。您第一支想找偏清爽的还是偏木质的？我按这个方向再帮您缩小范围。"}, {"candidate_id": "REC-004-C2", "text": "唐先生，先跟您说明，650 以内这次目录里没有对应规格。可比较的几支是青岚 50 mL 980 元、暮光 50 mL 1080 元、雨白 50 mL 1180 元，砚泊 30 mL 780 元。四支都能到店试闻，您方便的话来闻一遍再定，比看描述准。"}, {"candidate_id": "REC-004-C3", "text": "唐先生，预算这边我如实说：650 元以内暂时没有可选规格，最接近的是砚泊 30 mL，780 元，干燥木质与焚香气息。如果愿意稍微放宽，青岚 50 mL 980 元是柑橘与雪松。您更接受哪种气味方向？我请门店同事陪您试闻确认。"}]}, {"case_id": "AFTER-001", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-001-C1", "text": "贺女士，收到您的消息了。暮光 100 mL 是玫瑰与柔和木质的气息，您闻到前调的玫瑰觉得正，这就好。之后如果对尾调或留香有想说的，随时发我，我请门店同事一起听您讲。您写香评时若有细节想核对，也可以直接找我。"}, {"candidate_id": "AFTER-001-C2", "text": "谢谢您特意来说这一句，前调玫瑰能合您心意，我听着也高兴。暮光 100 mL 收到后，您先按自己的节奏用着，有任何感受都欢迎写下来发我。门店那边可以帮您对接，需要时告诉我一声就行。"}, {"candidate_id": "AFTER-001-C3", "text": "收到，暮光 100 mL 的玫瑰前调您喜欢，这份反馈我替您转给门店。您平时在意前调清透和尾调干净，等用上一段时间，尾调的感受也可以随时跟我说。要是想再到店闻闻其他几款，我帮您登记意向，由门店和您确认时间。"}]}, {"case_id": "AFTER-002", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-002-C1", "text": "收到您的反馈了。暮光的中调在您身上确实比试香时更甜，这点我记下来，不会替您否定实际闻到的感受。周六您来，我把青岚 50 mL 备出来一起闻，它偏柑橘与雪松，甜度低一些，正好和暮光对照着比较。您看这样安排行吗？"}, {"candidate_id": "AFTER-002-C2", "text": "谢谢您把中调的变化说得这么具体，这对我帮您比较很有用。每个人的甜感不同，您觉得明显，就以您的感受为准。周六到店时先闻青岚，柑橘与雪松的气息清爽些，再回头闻暮光，差别会更容易分辨。到店前有什么想先问的，直接发我就好。"}, {"candidate_id": "AFTER-002-C3", "text": "好，周六见。青岚 50 mL 我会提前放在试香台，您到了直接闻。暮光您已经拆开在用，先不用管它，等比较过青岚再决定要不要换着用。周六大概几点到？我请门店同事按时间给您留位。"}]}, {"case_id": "AFTER-003", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-003-C1", "text": "苏女士，收到您消息了。礼盒缎带磨损的情况，麻烦您拍张照片发我，我请门店同事按照片和订单凭证核查，看能否更换礼盒。刻字这边，暮光 100 mL 是否支持、字数样式和费用都由门店确认，我这边先帮您登记意向，具体由门店与您确认，您看这样行吗？"}, {"candidate_id": "AFTER-003-C2", "text": "苏女士，缎带磨损的照片方便发我一张吗？我请门店同事看下礼盒能否更换，连同订单凭证一起核查。刻字我也可以一并帮您问，暮光 100 mL 能不能刻、刻几个字、怎么收费，都以门店答复为准。您收到后还没拆封，照片和凭证齐了会好办些。"}, {"candidate_id": "AFTER-003-C3", "text": "苏女士，礼盒的事我请门店同事跟您确认，麻烦您把缎带磨损处拍清楚，再附上订单凭证。刻字方面，暮光 100 mL 是否可刻、字数与费用门店会一并答复。您先发照片，我这边帮您登记换礼盒和刻字的意向，由门店与您联系。"}]}, {"case_id": "WAKE-001", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-001-C1", "text": "方先生，好久没联系了。上次您来试砚泊，说喜欢它的焚香尾调，我偶尔还会想起那次聊香的过程。最近店里没有安排新的活动，只是想问一句：木质和限量这个方向，您现在还感兴趣吗？如果还感兴趣，您来店里时我再陪您慢慢看。"}, {"candidate_id": "WAKE-001-C2", "text": "方先生，打扰一下。距离您上次到店快半年了，想跟您问声好。砚泊还是那支干燥木质与焚香的气息，您当时说偏收藏向，我记着这句话。木质和限量这类，您近来还愿意看看吗？愿意的话，我按您的节奏来安排，不着急。"}, {"candidate_id": "WAKE-001-C3", "text": "方先生，近来可好？上次私人预览之后有段时间没见了，想问问您对木质与限量这个方向是否还有兴趣。有的话，我可以先帮您登记一个到店试香的意向，具体时间由门店和您确认。您方便时回我一句就行。"}]}, {"case_id": "WAKE-002", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-002-C1", "text": "沈女士，木质主题这边有两支可以给您先看看：砚泊 30 mL，干燥木质与焚香气息，780 元；暮光 50 mL，玫瑰与柔和木质气息，1080 元。两支都能到店试闻。您要是想先看哪支，我把具体信息发您，到店时间我请门店跟您对。"}, {"candidate_id": "WAKE-002-C2", "text": "木质主题的试香信息我按您说的多发一些。这次先给您砚泊 30 mL，干燥木质与焚香气息；还有暮光 50 mL，玫瑰与柔和木质气息。您之前闻过的青岚偏清透，这两支木质更明显一些。哪支想细看，回我一声就行。"}, {"candidate_id": "WAKE-002-C3", "text": "沈女士，砚泊和暮光都可以到店试闻，砚泊是 30 mL、780 元，暮光是 50 mL、1080 元，都是木质方向。您方便的话，我帮您登记一个到店试香的意向，具体时间由门店和您确认。您看这周还是下周合适？"}]}, {"case_id": "WAKE-003", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-003-C1", "text": "唐先生，您上次说想先了解栖序，我把品牌简单说一下：我们做个人香水，目前有四款——青岚、暮光、雨白、砚泊，都可以到店试闻。您平时有没有比较习惯的气味方向？我按这个帮您缩小范围。不着急， const KEY = 'qixu-eval-formal-v15';
let state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); updateProgress(); }

function updateProgress() {
  let done = 0;
  for (const it of ITEMS) {
    const s = state[it.case_id];
    if (s && s.candidates && it.candidates.every(c => s.candidates[c.candidate_id] && s.candidates[c.candidate_id].decision && s.candidates[c.candidate_id].reason)) done++;
  }
  document.getElementById('progress').textContent = done + '/' + ITEMS.length;
}

function render() {
  const main = document.getElementById('main');
  const rater = document.getElementById('rater');
  if (state._rater) rater.value = state._rater;
  rater.addEventListener('input', () => { state._rater = rater.value.trim(); save(); });
  for (const it of ITEMS) {
    const s = state[it.case_id] || (state[it.case_id] = { candidates: {} });
    const div = document.createElement('div');
    div.className = 'case';
    div.id = 'case-' + it.case_id;
    div.innerHTML = '<h2>' + it.case_id + ' · ' + it.scenario + '</h2>';
    it.candidates.forEach((c, idx) => {
      const cr = s.candidates[c.candidate_id] || (s.candidates[c.candidate_id] = {});
      const cand = document.createElement('div');
      cand.className = 'cand';
      cand.innerHTML = '<div class="text">' + escapeHtml(c.text) + '</div>'
        + '<div class="radios">'
        + ['直接用','小改可用','实质改写','弃用'].map(g =>
            '<label><input type="radio" name="' + it.case_id + '-c' + idx + '" value="' + g + '">' + g + '</label>').join('')
        + '<span class="sev"><label><input type="checkbox" class="sevbox"> 严重错误</label></span>'
        + '</div>'
        + '<textarea class="reason" rows="1" placeholder="一句话理由"></textarea>';
      div.appendChild(cand);
      const radios = cand.querySelectorAll('input[type=radio]');
      const sev = cand.querySelector('.sevbox');
      const reason = cand.querySelector('.reason');
      if (cr.decision) cand.querySelector('input[value="' + cr.decision + '"]').checked = true;
      if (cr.serious_error) sev.checked = true;
      if (cr.reason) reason.value = cr.reason;
      function sync() {
        cr.decision = Array.from(radios).find(r => r.checked)?.value || '';
        cr.serious_error = sev.checked;
        cr.reason = reason.value.trim();
        if (cr.serious_error && (cr.decision === '直接用' || cr.decision === '小改可用')) {
          const discard = cand.querySelector('input[value="弃用"]');
          if (discard) discard.checked = true;
          cr.decision = '弃用';
        }
        save();
      }
      radios.forEach(r => r.addEventListener('change', sync));
      sev.addEventListener('change', sync);
      reason.addEventListener('input', () => { cr.reason = reason.value.trim(); save(); });
      reason.addEventListener('blur', sync);
    });
    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = '<label><input type="checkbox" class="two"> 至少两条独立可用</label>'
      + '<input type="text" class="dreason" placeholder="三稿差异/选稿理由（一句话）">';
    const two = group.querySelector('.two');
    const dreason = group.querySelector('.dreason');
    if (s.two_distinct_usable) two.checked = true;
    if (s.diversity_reason) dreason.value = s.diversity_reason;
    function syncGroup() {
      s.two_distinct_usable = two.checked;
      s.diversity_reason = dreason.value.trim();
      div.classList.toggle('done', two.checked);
      save();
    }
    two.addEventListener('change', syncGroup);
    dreason.addEventListener('input', () => { s.diversity_reason = dreason.value.trim(); save(); });
    dreason.addEventListener('blur', syncGroup);
    div.appendChild(group);
    main.appendChild(div);
  }
  updateProgress();
}

  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

        candidate_id: c.candidate_id,
        decision: cr.decision || '',
        serious_error: !!cr.serious_error,
        reason: (cr.reason || '').trim(),
        edited_text: '',
        edit_seconds: null,
      };
    });
    const incomplete = cands.some(c => !c.decision || !c.reason);
    const row = {
      run_id: 'formal-v15',
      case_id: it.case_id,
      rater: (document.getElementById('rater').value || '').trim(),
      rater_role: '开发者自评',
      human_confirmed: true,
      candidates: cands,
      two_distinct_usable: !!s.two_distinct_usable,
      diversity_reason: (s.diversity_reason || '').trim(),
    };
    if (incomplete || !row.rater || !row.diversity_reason) problems.push(it.case_id);
    rows.push(row);
  }
  return { rows, problems };
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const { rows, problems } = buildExport();
  if (problems.length) {
    const skip = confirm('还有 ' + problems.length + ' 例未完成（含评分人或组级理由）：\n' + problems.join(', ') + '\n\n确定仍导出（未完成行会留空档位）？');
    if (!skip) return;
  }
  const blob = new Blob([rows.map(r => JSON.stringify(r)).join('\n')], { type: 'application/jsonl' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ratings.jsonl';
  a.click();
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = reader.result.split('\n').filter(l => l.trim()).map(l => JSON.parse(l));
      for (const r of rows) {
        const s = state[r.case_id] || (state[r.case_id] = {});
        s.two_distinct_usable = !!r.two_distinct_usable;
        s.diversity_reason = r.diversity_reason || '';
        s.candidates = {};
        for (const c of r.candidates) s.candidates[c.candidate_id] = { decision: c.decision, serious_error: !!c.serious_error, reason: c.reason || '' };
        if (r.rater) state._rater = r.rater;
      }
      save();
      location.reload();
    } catch (err) { alert('导入失败：文件格式不对。' + err.message); }
  };
  reader.readAsText(file);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('清空全部评分进度？')) { localStorage.removeItem(KEY); location.reload(); }
});

render();
</script>
</body>
</html>
