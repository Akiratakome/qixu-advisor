<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖序 QIXU · 评分表 formal-v16</title>
<style>
:root { --gold:#b9935a; --ink:#2c2a26; --paper:#faf7f2; --line:#e6ddcd; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif; background:var(--paper); color:var(--ink); }
header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:10px 20px; z-index:5; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
h1 { font-size:17px; margin:0; letter-spacing:1px; }
.muted { color:#8a8374; font-size:12px; }
#progress { font-weight:600; color:var(--gold); }
button { cursor:pointer; border:1px solid var(--gold); background:#fff; color:var(--ink); padding:6px 14px; border-radius:6px; font-size:13px; }
button.primary { background:var(--gold); color:#fff; }
button:hover { opacity:.9; }
main { max-width:860px; margin:0 auto; padding:14px 20px 80px; }
.case { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.case.done { border-left:4px solid var(--gold); }
.case h2 { font-size:14px; margin:0 0 6px; }
.cand { border-top:1px dashed var(--line); padding:10px 0; }
.cand .text { white-space:pre-wrap; background:#fbf9f4; padding:8px 10px; border-radius:6px; font-size:13.5px; }
.radios { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 4px; font-size:13px; }
.radios label { display:flex; gap:4px; align-items:center; }
.sev { margin-left:auto; display:flex; gap:4px; align-items:center; font-size:13px; color:#a33; }
.reason { width:100%; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
.group { border-top:2px solid var(--gold); padding-top:8px; font-size:13px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.group input { width:60%; }
.hint { color:#a33; font-size:12px; display:none; }
fieldset { border:1px solid var(--line); border-radius:8px; margin:10px 0; padding:10px; background:#fdfaf4; font-size:13px; }
legend { color:var(--gold); font-weight:600; padding:0 6px; }
</style>
</head>
<body>
<header>
  <h1>栖序 QIXU · 候选评分表</h1>
  <span class="muted">formal-v16 · 50 例 × 3 条 = 150 条 · 进度 <span id="progress">0/50</span></span>
  <label class="muted">评分人 <input id="rater" style="width:120px" placeholder="你的名字"></label>
  <button id="exportBtn" class="primary">导出结果</button>
  <button id="copyBtn">复制结果</button>
  <button id="importBtn">导入进度</button>
  <input type="file" id="importFile" accept=".jsonl,.json" hidden>
  <button id="resetBtn">清空</button>
  <div id="exportModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;padding:24px;">
    <div style="background:#fff;border-radius:10px;max-width:760px;margin:0 auto;padding:16px;height:85vh;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>导出结果（ratings.jsonl 内容）</b>
        <button id="closeModal">关闭</button>
      </div>
      <p class="muted" id="exportSummary"></p>
      <textarea id="exportText" readonly style="flex:1;font:12px/1.5 monospace;border:1px solid #ddd;border-radius:6px;padding:8px;"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button id="copyFromModal" class="primary">复制全部</button>
        <button id="downloadFromModal">下载文件</button>
      </div>
    </div>
  </div>
</header>
<main id="main">
<fieldset>
  <legend>两步评价</legend>
  <b>第一步·硬失败筛查</b>：有「没回答/答非所问/编造事实或越权/拒绝联系仍召回/模型自述或结构不可发送」任一问题 → 勾「严重错误」，档位必须选「弃用」。<br>
  <b>第二步·档位</b>：直接用（可直接发送）｜小改可用（删冗余/换称呼/调语序）｜实质改写（要改人物/商品/金额/方向）｜弃用（主干保不住）。<br>
  每条都要写一句理由；每组底部判断「至少两条独立可用」。进度自动保存在本机浏览器，随时可关页面接着评。
</fieldset>
</main>
<script>
const ITEMS = [{"case_id": "BD-001", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-001-C1", "text": "蒋先生，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当，所有的美好都如约而至。愿这一年如您喜欢的香气，明亮又长久。"}, {"candidate_id": "BD-001-C2", "text": "蒋先生，今天是您的生日，祝您生日快乐。愿这一年身体康健、日子舒展，想要的都慢慢实现。若今天有空，也别忘了给自己留一点清闲。"}, {"candidate_id": "BD-001-C3", "text": "蒋先生，四季轮转，又到属于您的日子。愿这一年平安顺遂，事事如愿，像秋日的柑橘一样清爽明亮。"}]}, {"case_id": "BD-002", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-002-C1", "text": "叶女士，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当，所有的美好都如约而至。愿这一年如您喜欢的香气，明亮又长久。"}, {"candidate_id": "BD-002-C2", "text": "叶女士，今天是您的生日，祝您生日快乐。愿这一年身体康健、日子舒展，想要的都慢慢实现。若今天有空，也别忘了给自己留一点清闲。"}, {"candidate_id": "BD-002-C3", "text": "叶女士，生日快乐。愿您的每一天都从容自在，所愿皆成真，平安顺遂常伴左右。"}]}, {"case_id": "BD-003", "scenario": "生日与节庆", "candidates": [{"candidate_id": "BD-003-C1", "text": "周先生，生日快乐。愿您新的一岁平安顺遂，想做的事都顺顺当当。愿这一年如您喜欢的香气，明亮又长久。"}, {"candidate_id": "BD-003-C2", "text": "周先生，今天是您的生日，祝您生日快乐。愿这一年日子舒展，想要的都慢慢实现，身边的人都平平安安。"}, {"candidate_id": "BD-003-C3", "text": "周先生，生日快乐。四季轮转，又到属于您的日子，愿这一年事事如愿，像秋日的柑橘一样清爽明亮。"}]}, {"case_id": "REC-001", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-001-C1", "text": "林女士，按您说的妹妹喜欢柑橘、排斥甜香，青岚这款香水更贴近她的方向，是柑橘与雪松的气息，甜度低。50 mL 是 980 元，在您一千六的预算内。暮光偏玫瑰，甜度中等，更适合您自己。要不要先让妹妹到店闻一下青岚？我帮您登记试香意向，由门店和您确认时间。"}, {"candidate_id": "REC-001-C2", "text": "给妹妹挑礼物，方向可以先收窄：青岚是柑橘与雪松的气息，甜度低，最贴合她的偏好；砚泊是干燥木质与焚香气息，甜度也低，30 mL 是 780 元，是另一个可以比较的选项。暮光玫瑰气息偏甜，不太适合她。妹妹平时用香水多吗？知道这一点，我能把范围再缩小一些。"}, {"candidate_id": "REC-001-C3", "text": "林女士，妹妹的偏好和您的不同，选礼时以她的柑橘方向为主更稳妥。青岚 50 mL 是 980 元，在您说的预算内，可以先作为首选去闻。若想多一个对比，砚泊 30 mL 是 780 元，木质焚香、甜度低。您方便的话，我把这两支留作试香，请门店同事和您约时间。"}]}, {"case_id": "REC-002", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-002-C1", "text": "方先生，青岚 50 mL 是 980 元，100 mL 是 1580 元。您平时收木质和皮革，青岚是柑橘与雪松的气息，甜度低，和您的口味方向接近。两个容量一起收，更多是备着慢慢用；是否值，要看您打算怎么分配。要不要先到店再闻一次青岚，闻过再定？"}, {"candidate_id": "REC-002-C2", "text": "方先生，您问两个容量一起收值不值，我觉得可以先想清楚各自放在哪儿用。青岚是柑橘与雪松的气息，甜度低，和您偏好的木质方向一致。50 mL 适合随身，100 mL 放在家里慢慢用；两只都收，等于多一个补货的余量。您更看重收藏完整，还是日常够用？"}, {"candidate_id": "REC-002-C3", "text": "方先生，青岚 50 mL 是 980 元，100 mL 是 1580 元，两只一起收，差价主要在容量上。您五月来闻过砚泊，喜欢焚香尾调；青岚的柑橘与雪松是另一个方向，甜度低。我建议先到店把青岚再闻一遍，确认前中后调都合您意，再决定两个容量怎么配。"}]}, {"case_id": "REC-003", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-003-C1", "text": "苏女士，按男士、喜欢木质、不要太甜这几点，砚泊更贴近：它是干燥木质与焚香的气息，30 mL 是 780 元。青岚 50 mL 是柑橘与雪松的气息，980 元，也在您的预算内。暮光偏玫瑰与柔和木质，甜度中等，可能不是您想要的。您看先按这两支来挑？"}, {"candidate_id": "REC-003-C2", "text": "收到，木质、不甜，这两点我记下了。砚泊是干燥木质与焚香气息，30 mL 780 元；青岚是柑橘与雪松气息，50 mL 980 元，这两支甜度都低。暮光带玫瑰，甜度中等，先排除。要不要约个时间到店闻一下，再定哪支送人？"}, {"candidate_id": "REC-003-C3", "text": "苏女士，砚泊 30 mL 是 780 元，干燥木质与焚香的气息；青岚 50 mL 是 980 元，柑橘与雪松的气息，这两支都在您五千的预算内。暮光的玫瑰气息偏柔，甜度中等，我暂时不放在首选。收礼人的具体喜好我不好替您判断，店里四款都可以试闻，您方便的话我帮您登记到店试香意向，由门店和您确认时间。"}]}, {"case_id": "REC-004", "scenario": "产品推荐", "candidates": [{"candidate_id": "REC-004-C1", "text": "唐先生，先跟您说实话：目前几款里最接近您预算的是砚泊 30 mL，780 元，干燥木质和焚香的气息。其余三款都是 50 mL，青岚 980 元、暮光 1080 元、雨白 1180 元，都在 650 元以上。第一次选香，我建议先到店闻一圈，闻过再决定买哪支、要不要等等。"}, {"candidate_id": "REC-004-C2", "text": "唐先生，650 元以内暂时没有对应的规格，我不绕弯子。四款里砚泊 30 mL 是 780 元，青岚、暮光、雨白都是 50 mL，价格在 980 到 1180 元之间。您平时是喜欢清爽一点的，还是偏木质、偏花香？说个大概方向，我帮您缩小到一两支，再来店里闻。"}, {"candidate_id": "REC-004-C3", "text": "唐先生，您这个预算我先记着，目前目录里没有 650 元以内的规格。如果愿意稍往上一点，砚泊 30 mL 是 780 元，木质和焚香偏干；青岚 50 mL 是 980 元，柑橘和雪松，清爽一些。要不要我先帮您登记到店试香意向，由门店和您约时间？闻过再定也不迟。"}]}, {"case_id": "AFTER-001", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-001-C1", "text": "收到您的消息了，暮光 100 mL 的玫瑰前调能合您心意，我听着也高兴。您平时在意尾调干净，后续用下来有什么感受，随时跟我说。要是有问题，把购买日期和订单凭证发我，我请门店同事帮您看看。"}, {"candidate_id": "AFTER-001-C2", "text": "谢谢您特意来说一声，您对前调一向敏感，暮光的玫瑰能得到您这句“很正”，我挺受用。您写香评时若想聊聊尾调的变化，我都在。有任何使用上的疑问，也可以直接找我，我请门店同事与您确认。"}, {"candidate_id": "AFTER-001-C3", "text": "收到，暮光 100 mL 您已经收到了，玫瑰前调合心意就好。您习惯留意前调清透和尾调干净，等用上一阵，欢迎把感受告诉我。若需要门店帮忙，把订单凭证留好，我帮您对接。"}]}, {"case_id": "AFTER-002", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-002-C1", "text": "林女士，暮光 50 mL 您上周带回去，到今天刚好一周。想问问您用下来感觉怎么样，玫瑰和木质那层气息合不合您的心意。要是有什么想聊的，随时跟我说，我帮您和门店对接。"}, {"candidate_id": "AFTER-002-C2", "text": "林女士，打扰一下。您 11 月 2 日买的暮光 50 mL，用了一周了，想听您说说实际感受，喜欢或哪里不太顺都可以讲。我这边帮您记下来，需要的话再请门店同事跟您细聊。"}, {"candidate_id": "AFTER-002-C3", "text": "林女士，暮光 50 mL 您带回去一周了，想问问用得还顺手吗。您之前在店里说喜欢柔和的玫瑰气息，这支闻起来是不是那个方向，都可以跟我说。有需要我帮您问门店的地方，也直接讲。"}]}, {"case_id": "AFTER-003", "scenario": "购后关怀", "candidates": [{"candidate_id": "AFTER-003-C1", "text": "收到您消息了。礼盒缎带磨损、还想加刻名字，这两件事我请门店同事跟您确认。麻烦您拍张缎带的照片，连同订单凭证一起发我，礼盒能否更换、刻字能否做，都由门店看过再答复您。您这份是答谢礼，时间上要是紧，也跟我说一声。"}, {"candidate_id": "AFTER-003-C2", "text": "苏女士，缎带磨损的事我记下了，还没送出去的话先别急着拆。换礼盒和刻字这两项，门店需要看实物照片和购买凭证来判断，我这边帮您把情况转过去。照片方便时发我就行，刻字的内容和样式也一并告诉我，门店会跟您确认能不能做。"}, {"candidate_id": "AFTER-003-C3", "text": "缎带磨损确实影响送出去的样子，您的心情我理解。换礼盒和刻字都需要门店先看照片和订单凭证，我帮您登记这个意向，由门店与您确认具体怎么处理。您把照片发我，我这边转给门店，有结果第一时间回您。"}]}, {"case_id": "WAKE-001", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-001-C1", "text": "方先生，好久没联系了。五月您来试砚泊时提过喜欢焚香尾调，那之后我偶尔会想起这个方向。想问问您现在还对木质和限量这类感兴趣吗？如果还在看，我可以帮您留意店里的动静，有合适的再和您说。"}, {"candidate_id": "WAKE-001-C2", "text": "方先生，打扰一下。上次私人预览之后有段时间没见了，您对木质和限量主题的兴趣还在吗？店里若有相关的试香安排，我帮您登记个意向，具体时间由门店和您确认。您看这样行吗？"}, {"candidate_id": "WAKE-001-C3", "text": "方先生，隔了半年问候一声。砚泊那支干燥木质与焚香的气息，您当时说偏收藏向，我记着这个方向。想确认下您现在还愿意收到木质、限量主题的消息吗？愿意的话我这边留意着，有合适的再联系您。"}]}, {"case_id": "WAKE-002", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-002-C1", "text": "沈女士，七月您来店里试过青岚，说喜欢，也不急着买。最近店里有两支偏木质的可以闻——砚泊是干燥木质与焚香气息，暮光带一点柔和木质。您若哪天顺路，我帮您登记试香意向，时间由门店和您确认。按您的节奏来，不着急。"}, {"candidate_id": "WAKE-002-C2", "text": "沈女士，隔了一阵子，想起您上次试青岚时说喜欢木质的方向。最近可以看看砚泊，干燥木质与焚香气息；暮光也有柔和木质，只是多了玫瑰。您想先了解哪一支，我请门店同事把能确认的信息发给您。"}, {"candidate_id": "WAKE-002-C3", "text": "沈女士，上次试青岚之后您说不急，我就没多打扰。最近木质方向有两支可以比较：砚泊 30 mL，干燥木质与焚香；暮光 50 mL，玫瑰与柔和木质。您方便的话回我一句想闻哪支，我帮您和门店约个时间。"}]}, {"case_id": "WAKE-003", "scenario": "沉睡唤醒", "candidates": [{"candidate_id": "WAKE-003-C1", "text": "唐先生，您好，我是栖序的顾问。之前您说想先了解一下品牌，等有空再看，这次就不多聊别的，只是想跟您认识一下。您要是愿意，我可以简单说说栖序在做的事；现在忙也没关系，等您方便再回我就好。"}, {"candidate_id": "WAKE-003-C2", "text": "唐先生，您好，我是栖序的顾问。您之前提过想先了解品牌，我这边不着急，也不给您安排什么。哪天您有空了，想听我讲讲栖序，或者想约到店闻闻，跟我说一声就行。"}, {"candid const KEY = 'qixu-eval-formal-v16';
let state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); updateProgress(); }

function updateProgress() {
  let done = 0;
  for (const it of ITEMS) {
    const s = state[it.case_id];
    if (s && s.candidates && it.candidates.every(c => s.candidates[c.candidate_id] && s.candidates[c.candidate_id].decision && s.candidates[c.candidate_id].reason)) done++;
  }
  document.getElementById('progress').textContent = done + '/' + ITEMS.length;
}

function render() {
  const main = document.getElementById('main');
  const rater = document.getElementById('rater');
  if (state._rater) rater.value = state._rater;
  rater.addEventListener('input', () => { state._rater = rater.value.trim(); save(); });
  for (const it of ITEMS) {
    const s = state[it.case_id] || (state[it.case_id] = { candidates: {} });
    const div = document.createElement('div');
    div.className = 'case';
    div.id = 'case-' + it.case_id;
    div.innerHTML = '<h2>' + it.case_id + ' · ' + it.scenario + '</h2>';
    it.candidates.forEach((c, idx) => {
      const cr = s.candidates[c.candidate_id] || (s.candidates[c.candidate_id] = {});
      const cand = document.createElement('div');
      cand.className = 'cand';
      cand.innerHTML = '<div class="text">' + escapeHtml(c.text) + '</div>'
        + '<div class="radios">'
        + ['直接用','小改可用','实质改写','弃用'].map(g =>
            '<label><input type="radio" name="' + it.case_id + '-c' + idx + '" value="' + g + '">' + g + '</label>').join('')
        + '<span class="sev"><label><input type="checkbox" class="sevbox"> 严重错误</label></span>'
        + '</div>'
        + '<textarea class="reason" rows="1" placeholder="一句话理由"></textarea>';
      div.appendChild(cand);
      const radios = cand.querySelectorAll('input[type=radio]');
      const sev = cand.querySelector('.sevbox');
      const reason = cand.querySelector('.reason');
      if (cr.decision) cand.querySelector('input[value="' + cr.decision + '"]').checked = true;
      if (cr.serious_error) sev.checked = true;
      if (cr.reason) reason.value = cr.reason;
      function sync() {
        cr.decision = Array.from(radios).find(r => r.checked)?.value || '';
        cr.serious_error = sev.checked;
        cr.reason = reason.value.trim();
        if (cr.serious_error && (cr.decision === '直接用' || cr.decision === '小改可用')) {
          const discard = cand.querySelector('input[value="弃用"]');
          if (discard) discard.checked = true;
          cr.decision = '弃用';
        }
        save();
      }
      radios.forEach(r => r.addEventListener('change', sync));
      sev.addEventListener('change', sync);
      reason.addEventListener('input', () => { cr.reason = reason.value.trim(); save(); });
      reason.addEventListener('blur', sync);
    });
    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = '<label><input type="checkbox" class="two"> 至少两条独立可用</label>'
      + '<input type="text" class="dreason" placeholder="三稿差异/选稿理由（一句话）">';
    const two = group.querySelector('.two');
    const dreason = group.querySelector('.dreason');
    if (s.two_distinct_usable) two.checked = true;
    if (s.diversity_reason) dreason.value = s.diversity_reason;
    function syncGroup() {
      s.two_distinct_usable = two.checked;
      s.diversity_reason = dreason.value.trim();
      div.classList.toggle('done', two.checked);
      save();
    }
    two.addEventListener('change', syncGroup);
    dreason.addEventListener('input', () => { s.diversity_reason = dreason.value.trim(); save(); });
    dreason.addEventListener('blur', syncGroup);
    div.appendChild(group);
    main.appendChild(div);
  }
  updateProgress();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildExport() {
  const rows = [];
  const problems = [];
  for (const it of ITEMS) {
    const s = state[it.case_id] || {};
    const cands = it.candidates.map(c => {
      const cr = (s.candidates && s.candidates[c.candidate_id]) || {};
      return {
        candidate_id: c.candidate_id,
        decision: cr.decision || '',
        serious_error: !!cr.serious_error,
        reason: (cr.reason || '').trim(),
        edited_text: '',
        edit_seconds: null,
      };
    });
    const incomplete = cands.some(c => !c.decision || !c.reason);
    const row = {
      run_id: 'formal-v16',
      case_id: it.case_id,
      rater: (document.getElementById('rater').value || '').trim(),
      rater_role: '开发者自评',
      human_confirmed: true,
      candidates: cands,
      two_distinct_usable: !!s.two_distinct_usable,
      diversity_reason: (s.diversity_reason || '').trim(),
    };
    if (incomplete || !row.rater || !row.diversity_reason) problems.push(it.case_id);
    rows.push(row);
  }
  return { rows, problems };
}

function renderExport() {
  const { rows, problems } = buildExport();
  const text = rows.map(r => JSON.stringify(r)).join('\n');
  document.getElementById('exportText').value = text;
  document.getElementById('exportSummary').textContent =
    '共 ' + rows.length + ' 例' + (problems.length ? '；其中未完成 ' + problems.length + ' 例（仍会导出，未评候选档位为空）' : '；全部完成');
  document.getElementById('exportModal').style.display = 'block';
}

function copyText(text) {
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(fallback);
  } else {
    fallback();
  }
}

document.getElementById('exportBtn').addEventListener('click', renderExport);
document.getElementById('copyBtn').addEventListener('click', () => {
  const { rows } = buildExport();
  copyText(rows.map(r => JSON.stringify(r)).join('\n'));
  alert('已复制到剪贴板，直接粘贴给我即可。');
});
document.getElementById('closeModal').addEventListener('click', () => document.getElementById('exportModal').style.display = 'none');
document.getElementById('copyFromModal').addEventListener('click', () => {
  copyText(document.getElementById('exportText').value);
  alert('已复制，粘贴给我即可。');
});
document.getElementById('downloadFromModal').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('exportText').value], { type: 'application/jsonl' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ratings.jsonl';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = reader.result.split('\n').filter(l => l.trim()).map(l => JSON.parse(l));
      for (const r of rows) {
        const s = state[r.case_id] || (state[r.case_id] = {});
        s.two_distinct_usable = !!r.two_distinct_usable;
        s.diversity_reason = r.diversity_reason || '';
        s.candidates = {};
        for (const c of r.candidates) s.candidates[c.candidate_id] = { decision: c.decision, serious_error: !!c.serious_error, reason: c.reason || '' };
        if (r.rater) state._rater = r.rater;
      }
      save();
      location.reload();
    } catch (err) { alert('导入失败：文件格式不对。' + err.message); }
  };
  reader.readAsText(file);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('清空全部评分进度？')) { localStorage.removeItem(KEY); location.reload(); }
});

render();
</script>
</body>
</html>
